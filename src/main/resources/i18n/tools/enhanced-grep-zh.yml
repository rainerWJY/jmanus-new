description: |
  增强型 grep 工具，支持高级文本搜索和正则表达式，类似于 ripgrep。
  
  此工具提供强大的文件和目录搜索功能，包括：
  - 正则表达式模式匹配
  - 多种输出模式（内容、文件列表、计数）
  - 使用 glob 模式或预定义类型进行文件类型过滤
  - 大小写不敏感搜索选项
  - 上下文行显示（匹配行的前/后/周围）
  - 多行匹配支持
  - 结果限制以防止输出过多
  
  支持的文件类型：java, py, js, ts, rust, go, cpp, md, json, xml, yaml, sql, sh, css, html
  
  输出模式：
  - content: 显示匹配行及其内容（默认）
  - files_with_matches: 仅显示包含匹配的文件路径
  - count: 显示每个文件的匹配计数
  
  关键词：grep、搜索、查找文本、正则表达式、ripgrep、rg、模式匹配、文本搜索

parameters: |
  {
    "type": "object",
    "properties": {
      "pattern": {
        "type": "string",
        "description": "要搜索的正则表达式模式（必需）"
      },
      "path": {
        "type": "string",
        "description": "要搜索的路径（文件或目录）。如果未指定，则默认为工作区根目录"
      },
      "glob": {
        "type": "string",
        "description": "用于文件过滤的 glob 模式（例如 '*.js'、'*.{ts,tsx}'）"
      },
      "type": {
        "type": "string",
        "description": "文件类型过滤器。支持的类型：java, py, js, ts, rust, go, cpp, md, json, xml, yaml, sql, sh, css, html"
      },
      "case_insensitive": {
        "type": "boolean",
        "description": "执行大小写不敏感的搜索（默认：false）"
      },
      "output_mode": {
        "type": "string",
        "enum": ["content", "files_with_matches", "count"],
        "description": "输出模式：'content'（默认，显示匹配行）、'files_with_matches'（仅显示文件路径）、'count'（匹配计数）"
      },
      "context_before": {
        "type": "integer",
        "description": "在每个匹配项之前显示的上下文行数"
      },
      "context_after": {
        "type": "integer",
        "description": "在每个匹配项之后显示的上下文行数"
      },
      "context": {
        "type": "integer",
        "description": "在每个匹配项前后显示的上下文行数（context_before 和 context_after 的简写）"
      },
      "multiline": {
        "type": "boolean",
        "description": "启用多行匹配，其中 . 匹配换行符（默认：false）。用于跨多行的模式搜索"
      },
      "head_limit": {
        "type": "integer",
        "description": "将输出限制为前 N 个结果（默认：1000）。用于防止输出过多"
      }
    },
    "required": ["pattern"]
  }
