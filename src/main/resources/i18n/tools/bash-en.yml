description: |
  Execute bash commands in terminal with interactive support (current OS: %s).
  * Action-based interface: Supports actions: 'command' (execute new command), 'send_input' (send input to interactive process), 'terminate' (stop current process).
  * Interactive commands: For commands like `git log` that require pagination, use 'command' action to start, then use 'send_input' with input='n' for next page, input='q' to quit, or input='\\n' for Enter key.
  * Long-running commands: For commands that may run indefinitely, they should be run in background with output redirected to file, e.g.: command = `python3 app.py > server.log 2>&1 &`.
  * Process management: Use 'terminate' to stop a running process. Process state is automatically tracked and available in tool state.
  * Timeout handling: If command execution result shows "Command timed out. Sending SIGINT to the process", assistant should try to re-run the command in background.

parameters: |
  {
      "type": "object",
      "properties": {
          "action": {
              "type": "string",
              "description": "The action to perform. Supported actions: 'command' (execute a new shell command), 'send_input' (send input to current interactive process, e.g., 'n' for next page, 'q' to quit), 'terminate' (terminate current process). If not specified, defaults to 'command' for backward compatibility.",
              "enum": ["command", "send_input", "terminate"]
          },
          "command": {
              "type": "string",
              "description": "The bash command to execute. Required for 'command' action."
          },
          "input": {
              "type": "string",
              "description": "Input to send to current interactive process. Required for 'send_input' action. Examples: 'n' for next page, 'q' to quit, '\\n' or 'Enter' for Enter key."
          }
      },
      "required": []
  }

